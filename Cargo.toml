[workspace]
resolver = "2"
members = ["daemon"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/kethan/lumen"

[workspace.dependencies]
zbus = "6"
libc = "0.2"
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
